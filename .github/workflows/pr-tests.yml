name: Pull request tests

on:
  pull_request:
    branches:
      - staged
      - main

# PR code is untrusted. Grant only read access and do not expose secrets.
permissions:
  contents: read

jobs:
  policy-tests:
    # Standard GitHub-hosted runners are free for public repositories.
    # The variable lets the runner label be changed centrally; fallback is
    # the standard hosted Ubuntu runner if the variable is unset.
    runs-on: ${{ vars.ACTIONS_GITHUB_HOSTED_RUNNER || 'ubuntu-latest' }}
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - name: Check out pull request
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      - name: Run policy tests and syntax checks
        shell: bash
        run: timeout --foreground 45s npm test

      - name: Validate manifest JSON
        run: node -e "JSON.parse(require('node:fs').readFileSync('manifest.json', 'utf8'))"
